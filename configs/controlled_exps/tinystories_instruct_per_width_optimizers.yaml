# Frozen TinyStories-Instruct shared-versus-per-width optimizer-state recipe.
# The baseline is shared. Override only run identity, seed, token budget, paths,
# and training.optimizer.state_scope for submitted paired arms.
controlled_experiment:
  comparison_group_id: tinystories_instruct_per_width_optimizers_v1
  intervention: optimizer_state_scope
  seeds: [42, 43, 44]
  pilot_budget_tokens: 713785344
  confirmation_budget_tokens: 2141356032
  pilot_steps: 87132
  confirmation_steps: 261396
  pilot_updates_per_width: 21783
  confirmation_updates_per_width: 65349
  holdout_opened_during_pilot: false

run:
  run_id: tinystories-instruct-optimizer-state-shared-s42
  phase_id: tinystories_instruct_per_width_optimizers
  model_family: nested
  sampling_mode: nested-random
  model_shape_label: tinystories-instruct-d64-l4
  seed: 42
  reproducibility:
    mode: strict
    seed_stream_version: 1
    data_split_version: 1
  output_root: outputs
  continuation:
    enabled: true
    latest_checkpoint_save_interval_steps: 0
    latest_checkpoint_save_on_validation: true
    latest_checkpoint_save_on_completion: true

model:
  base_model_name: tinystories-instruct-per-width-optimizer-llama
  tokenizer_dir: __PREPARED_TOKENIZER_DIR__
  variant: slicing
  correction_mode: none
  granularity_mode: explicit
  granularity_sampling_mode: global
  global_sampling_schedule: balanced_cycle
  global_sampling_interval_steps: 1
  d_model: 64
  num_layers: 4
  num_attention_heads: 4
  context_length: 128
  vocab_size: 2048
  initializer_range: 0.02
  granularities: [g250, g500, g750, g1000]
  granularity_prefixes:
    g250: 0.25
    g500: 0.50
    g750: 0.75
    g1000: 1.00

training:
  token_budget: 713785344
  max_steps_cap: null
  batch_size_per_process: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.008
  learning_rate_scale_rule: none
  warmup_steps: 64
  pre_nested_warmup:
    enabled: false
    duration: 0
    unit: steps
  gradient_clip_norm: 1.0
  mixed_precision: bf16
  activation_checkpointing: false
  dataloader_num_workers: 0
  optimizer:
    name: adamw
    state_scope: shared
    scheduler_clock: global_step
    kwargs:
      betas: [0.9, 0.95]
      eps: 1.0e-8
      weight_decay: 0.1
  scheduler:
    name: cosine
  distributed:
    strategy: none
    expected_world_size: 1

dataset:
  mode: packed_mmap
  prepared_corpus_dir: __PREPARED_CORPUS_DIR__
  optimizer_iteration:
    mode: repeat_epochs
    epoch_order: deterministic_per_epoch
  fixed_four_role_partition: true
  data_seed: 42
  dataset_name: roneneldan/TinyStoriesInstruct
  dataset_config_name: default
  dataset_split: train+validation
  dataset_phase: tinystories_instruct_controlled
  sample_limit: null
  tokenization_keep_in_memory: false
  preprocessing_notes: complete_record_lf_join_preserve_fields_and_internal_newlines_v1

outputs:
  save_config: true
  save_metrics_csv: true
  save_run_summary_json: true
  save_checkpoints: true
  make_plots: false
  metrics_flush_interval_steps: 32
  best_eval_retention_count: 1
  artifact_io:
    checkpoint_staging: auto

monitoring:
  enabled: false
  backend: wandb
  project: tinystories_instruct_per_width_optimizers
  job_type: train
  tags: [controlled-experiment, tinystories-instruct, optimizer-state-scope]
  notes: frozen paired shared-versus-per-width optimizer-state experiment
  log_loss_by_granularity: true
  log_validation_loss: true
  log_stage_events: true

evaluation:
  validation:
    enabled: true
    interval_steps: 64
    interval_tokens: 0
    run_at_completion: true
    holdout:
      source: configured_dataset_split
      examples: 128
    trailing_summary_evaluations: 5
  adaptive_controller:
    enabled: true
    source: configured_dataset_split
    examples: 128
    objective_weights: uniform
    fixed_manifest: true
  final_holdout:
    enabled: true
    source: configured_dataset_split
    examples: 512
    fixed_manifest: true
    evaluate_during_training: false
  test:
    enabled: false
  downstream_suite: []
  consistency: false
  speculative: false
