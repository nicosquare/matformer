# Controlled dense-recipe convergence calibration on immutable TinyStories data.
# Supply model.tokenizer_dir and dataset.prepared_corpus_dir on every launch.
controlled_experiment:
  recipe_status: calibration
  recipe_source_run_id: null
  selection_report_hash: null

run:
  run_id: tinystories-dense-calibration
  phase_id: tinystories_controlled_convergence
  model_family: standalone
  sampling_mode: standalone
  granularity: g1000
  model_shape_label: tinystories-d128-l4
  seed: 42
  reproducibility:
    mode: strict
    seed_stream_version: 1
    data_split_version: 1
  output_root: outputs
  continuation:
    enabled: true
    latest_checkpoint_save_interval_steps: 0
    latest_checkpoint_save_on_validation: true
    latest_checkpoint_save_on_completion: true

model:
  base_model_name: tinystories-controlled-llama
  tokenizer_dir: __PREPARED_TOKENIZER_DIR__
  variant: slicing
  correction_mode: none
  granularity_mode: explicit
  granularity_sampling_mode: global
  d_model: 128
  num_layers: 4
  num_attention_heads: 4
  context_length: 128
  vocab_size: 2048
  granularities: [g125, g250, g500, g1000]
  granularity_prefixes:
    g125: 0.125
    g250: 0.25
    g500: 0.5
    g1000: 1.0

training:
  # 64 sequences x 128 tokens = 8,192 tokens/update; this is 2,048 updates.
  token_budget: 16777216
  max_steps_cap: null
  batch_size_per_process: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  learning_rate_scale_rule: none
  warmup_steps: 64
  pre_nested_warmup:
    enabled: false
    duration: 0
    unit: steps
  gradient_clip_norm: 1.0
  mixed_precision: bf16
  activation_checkpointing: false
  dataloader_num_workers: 0
  optimizer:
    name: adamw
    kwargs:
      betas: [0.9, 0.95]
      eps: 1.0e-8
      weight_decay: 0.1
  scheduler:
    name: cosine
  distributed:
    strategy: none
    expected_world_size: 1

dataset:
  mode: packed_mmap
  prepared_corpus_dir: __PREPARED_CORPUS_DIR__
  fixed_four_role_partition: true
  data_seed: 42
  dataset_name: roneneldan/TinyStories
  dataset_config_name: default
  dataset_split: train+validation
  dataset_phase: tinystories_controlled
  sample_limit: null
  tokenization_keep_in_memory: false
  preprocessing_notes: immutable_nonempty_huggingface_rows_contiguous_eos_uint32_v1

outputs:
  save_config: true
  save_metrics_csv: true
  save_run_summary_json: true
  save_checkpoints: true
  make_plots: false
  metrics_flush_interval_steps: 32
  best_eval_retention_count: 1
  artifact_io:
    checkpoint_staging: auto

monitoring:
  enabled: false
  backend: wandb
  project: tinystories_controlled_convergence
  job_type: train
  tags: [controlled-experiment, tinystories, dense-calibration]
  notes: dense recipe calibration before standalone and elastic comparisons
  log_loss_by_granularity: true
  log_validation_loss: true
  log_stage_events: true

evaluation:
  validation:
    enabled: true
    interval_steps: 64
    interval_tokens: 0
    run_at_completion: true
    holdout:
      source: configured_dataset_split
      examples: 128
    trailing_summary_evaluations: 5
  # Materialize the shared roles now so later mode overrides keep identical data.
  adaptive_controller:
    enabled: true
    source: configured_dataset_split
    examples: 128
    objective_weights: uniform
    fixed_manifest: true
  final_holdout:
    enabled: true
    source: configured_dataset_split
    examples: 512
    fixed_manifest: true
    evaluate_during_training: false
  test:
    enabled: false
  downstream_suite: []
  consistency: false
  speculative: false
