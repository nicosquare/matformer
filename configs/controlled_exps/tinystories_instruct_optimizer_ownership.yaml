# Fixed nine-run protocol; preflight materializes ordinary trainer configs.
# Run identities are campaign ID + arm + seed; no training is launched here.
schema_version: 1
campaign_id: tinystories-optimizer-ownership-v1
common:
  run:
    phase_id: tinystories_optimizer_ownership
    model_shape_label: tinystories-instruct-d64-l4
    seed: 42
    reproducibility:
      mode: strict
      seed_stream_version: 1
      data_split_version: 1
    continuation:
      enabled: true
      latest_checkpoint_save_interval_steps: 0
      latest_checkpoint_save_on_validation: true
      latest_checkpoint_save_on_completion: true
  model:
    base_model_name: tinystories-instruct-optimizer-ownership-llama
    tokenizer_dir: __PREPARED_TOKENIZER_DIR__
    correction_mode: none
    granularity_mode: explicit
    d_model: 64
    num_layers: 4
    num_attention_heads: 4
    context_length: 128
    vocab_size: 2048
    initializer_range: 0.02
    granularities:
    - g250
    - g500
    - g750
    - g1000
    granularity_prefixes:
      g250: 0.25
      g500: 0.5
      g750: 0.75
      g1000: 1.0
  training:
    max_steps_cap: null
    batch_size_per_process: 64
    gradient_accumulation_steps: 1
    learning_rate: 0.008
    learning_rate_scale_rule: none
    warmup_steps: 64
    pre_nested_warmup:
      enabled: false
      duration: 0
      unit: steps
    gradient_clip_norm: 1.0
    mixed_precision: bf16
    activation_checkpointing: false
    dataloader_num_workers: 0
    optimizer:
      name: adamw
      scheduler_clock: global_step
      kwargs:
        betas:
        - 0.9
        - 0.95
        eps: 1.0e-08
        weight_decay: 0.1
    scheduler:
      name: cosine
    distributed:
      strategy: none
      expected_world_size: 1
    gradient_clipping:
      mode: global
      norm_type: 2
  dataset:
    mode: packed_mmap
    prepared_corpus_dir: __PREPARED_CORPUS_DIR__
    optimizer_iteration:
      mode: repeat_epochs
      epoch_order: deterministic_per_epoch
    fixed_four_role_partition: true
    data_seed: 42
    dataset_name: roneneldan/TinyStoriesInstruct
    dataset_config_name: default
    dataset_split: train+validation
    dataset_phase: tinystories_instruct_controlled
    sample_limit: null
    tokenization_keep_in_memory: false
    preprocessing_notes: complete_record_lf_join_preserve_fields_and_internal_newlines_v1
  outputs:
    save_config: true
    save_metrics_csv: true
    save_run_summary_json: true
    save_checkpoints: true
    make_plots: false
    metrics_flush_interval_steps: 32
    best_eval_retention_count: 1
    artifact_io:
      checkpoint_staging: auto
  monitoring:
    enabled: false
    backend: wandb
    project: tinystories_optimizer_ownership
    job_type: train
    tags:
    - controlled-experiment
    - optimizer-ownership
    notes: Seed-42 nine-arm ownership and clipping comparison
    log_loss_by_granularity: true
    log_validation_loss: true
    log_stage_events: true
  evaluation:
    validation:
      enabled: true
      interval_steps: 64
      interval_tokens: 0
      run_at_completion: true
      holdout:
        source: configured_dataset_split
        examples: 128
      trailing_summary_evaluations: 5
    adaptive_controller:
      enabled: true
      source: configured_dataset_split
      examples: 128
      objective_weights: uniform
      fixed_manifest: true
    final_holdout:
      enabled: true
      source: configured_dataset_split
      examples: 512
      fixed_manifest: true
      evaluate_during_training: false
    test:
      enabled: false
    downstream_suite: []
    consistency: false
    speculative: false
arms:
  ST-g250:
    run:
      model_family: standalone
      granularity: g250
    model:
      variant: slicing
    training:
      token_budget: 713785344
      optimizer:
        state_scope: shared
  ST-g500:
    run:
      model_family: standalone
      granularity: g500
    model:
      variant: slicing
    training:
      token_budget: 713785344
      optimizer:
        state_scope: shared
  ST-g750:
    run:
      model_family: standalone
      granularity: g750
    model:
      variant: slicing
    training:
      token_budget: 713785344
      optimizer:
        state_scope: shared
  ST-g1000:
    run:
      model_family: standalone
      granularity: g1000
    model:
      variant: slicing
    training:
      token_budget: 713785344
      optimizer:
        state_scope: shared
  S1:
    run:
      model_family: nested
      sampling_mode: nested-random
    model:
      variant: slicing
      granularity_sampling_mode: global
      global_sampling_schedule: random_with_replacement
      global_sampling_interval_steps: 1
    training:
      token_budget: 2855141376
      optimizer:
        state_scope: shared
  S2:
    run:
      model_family: nested
      sampling_mode: nested-random
    model:
      variant: slicing
      granularity_sampling_mode: global
      global_sampling_schedule: random_with_replacement
      global_sampling_interval_steps: 1
    training:
      token_budget: 2855141376
      optimizer:
        state_scope: per_granularity
  C1:
    run:
      model_family: nested
      sampling_mode: nested-random
    model:
      variant: concat
      granularity_sampling_mode: global
      global_sampling_schedule: random_with_replacement
      global_sampling_interval_steps: 1
    training:
      token_budget: 2855141376
      optimizer:
        state_scope: shared
  C2:
    run:
      model_family: nested
      sampling_mode: nested-random
    model:
      variant: concat
      granularity_sampling_mode: global
      global_sampling_schedule: random_with_replacement
      global_sampling_interval_steps: 1
    training:
      token_budget: 2855141376
      optimizer:
        state_scope: per_granularity
  C3:
    run:
      model_family: nested
      sampling_mode: nested-random
    model:
      variant: concat
      granularity_sampling_mode: global
      global_sampling_schedule: random_with_replacement
      global_sampling_interval_steps: 1
    training:
      token_budget: 2855141376
      optimizer:
        state_scope: per_ffn_block
      gradient_clipping:
        mode: per_owner
        norm_type: 2
        owner_max_norms:
          O-A: 1.0
          O-B: 1.0
          O-C: 1.0
          O-D: 1.0
          O-common: 1.0
