# Explicit opt-in d_model=256 pilot surface for Bayesian adaptive granularity.
# The queue launcher adds both global and additive per-block Thompson runs only
# when invoked with --include-probabilistic. Its default comparison matrix is
# intentionally unchanged.
run:
  run_id: probabilistic-adaptive-granularity-smoke-001
  phase_id: probabilistic_adaptive_granularity
  model_family: nested
  sampling_mode: nested-random
  model_shape_label: dmodel256
  family_size_slug: 148m
  seed: 42
  reproducibility:
    mode: strict
    seed_stream_version: 1
    data_split_version: 1
  output_root: outputs
  continuation:
    enabled: true
    latest_checkpoint_save_interval_steps: 1
    latest_checkpoint_save_on_validation: true
    latest_checkpoint_save_on_completion: true

model:
  base_model_name: dmodel256-matformer-llama-swiglu
  variant: slicing
  correction_mode: gmc
  tokenizer_name: hf-internal-testing/llama-tokenizer
  d_model: 256
  num_layers: 16
  num_attention_heads: 16
  context_length: 1024
  vocab_size_assumption: 256000
  granularities: [s, m, l, xl]
  granularity_prefixes:
    s: 0.125
    m: 0.25
    l: 0.5
    xl: 1.0
  granularity_sampling_mode: adaptive_global
  adaptive_sampler_strategy: thompson
  adaptive_controller:
    decision_interval_steps: 2
    prior_mean: 0.0
    prior_covariance: 1.0
    observation_noise_variance: 0.01
    process_noise_covariance: 0.0001

training:
  token_budget: 16384
  max_steps: 4
  batch_size_per_process: 4
  learning_rate: 0.001
  learning_rate_scale_rule: none
  warmup_steps: 0
  warmup_ratio: 0.0
  pre_nested_warmup:
    enabled: false
    duration: 0
    unit: steps
  gradient_clip_norm: 1.0
  mixed_precision: bf16
  activation_checkpointing: true
  preprocess_num_proc: 1
  dataloader_num_workers: 0
  optimizer:
    preset: adam
  scheduler:
    name: cosine
  distributed:
    strategy: fsdp
    fsdp:
      sharding_strategy: full_shard
      auto_wrap_policy: transformer_based_wrap
      transformer_layer_cls_to_wrap:
        - LlamaDecoderLayer
      backward_prefetch: backward_pre
      use_orig_params: true
      sync_module_states: true
      forward_prefetch: false

dataset:
  dataset_name: HuggingFaceFW/fineweb
  dataset_config_name: sample-10BT
  dataset_split: train
  dataset_phase: debug
  # Covers ordinary validation, controller, final holdout, and training roles.
  sample_limit: 2048
  tokenization_keep_in_memory: true
  preprocessing_notes: truncate_or_pad_to_context_length_probabilistic_smoke

outputs:
  save_config: true
  save_metrics_csv: true
  save_run_summary_json: true
  save_checkpoints: true
  make_plots: false

monitoring:
  enabled: false
  backend: wandb
  project: probabilistic_adaptive_granularity
  job_type: train
  tags: [pilot, dmodel256, probabilistic]
  notes: explicit opt-in Bayesian adaptive-granularity pilot smoke
  log_loss_by_granularity: true
  log_validation_loss: true
  log_stage_events: true

evaluation:
  validation:
    enabled: true
    interval_steps: 2
    run_at_completion: true
    holdout:
      source: configured_dataset_split
      examples: 512
    trailing_summary_evaluations: 2
  adaptive_controller:
    enabled: true
    source: configured_dataset_split
    examples: 128
    objective_weights: uniform
    fixed_manifest: true
  final_holdout:
    enabled: true
    source: configured_dataset_split
    examples: 512
    fixed_manifest: true
    evaluate_during_training: false
  test:
    enabled: false
  downstream_suite: []
  consistency: false
  speculative: false
