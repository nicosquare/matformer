# Five-granularity reference for balanced pre-adaptive warmup.
run:
  run_id: probabilistic-balanced-warmup-500-001
  phase_id: probabilistic_adaptive_granularity
  model_family: nested
  model_size_label: debug
  sampling_mode: nested-random
  seed: 42
  reproducibility:
    mode: strict
    seed_stream_version: 1
    data_split_version: 1
  output_root: outputs
  continuation:
    enabled: true
    latest_checkpoint_save_interval_steps: 25
    latest_checkpoint_save_on_validation: true
    latest_checkpoint_save_on_completion: true

model:
  base_model_name: debug-llama
  granularity_mode: explicit
  granularity_sampling_mode: adaptive_global
  adaptive_sampler_strategy: thompson
  adaptive_controller:
    decision_interval_steps: 50
    prior_mean: 0.0
    prior_covariance: 1.0
    observation_noise_variance: 0.01
    process_noise_covariance: 0.0001
  variant: slicing
  correction_mode: gmc
  tokenizer_name: hf-internal-testing/llama-tokenizer
  d_model: 128
  num_layers: 2
  num_attention_heads: 4
  context_length: 64
  vocab_size_assumption: 32000
  granularities: [micro, small, medium, large, full]
  granularity_prefixes:
    micro: 0.125
    small: 0.25
    medium: 0.5
    large: 0.75
    full: 1.0

training:
  token_budget: 70400
  max_steps: 550
  batch_size_per_process: 2
  learning_rate: 0.0003
  warmup_steps: 0
  pre_nested_warmup:
    enabled: true
    duration: 500
    unit: steps
    policy: balanced_global
    action_interval_steps: 50
  gradient_clip_norm: 1.0
  optimizer:
    preset: adam
  scheduler:
    name: cosine
  eval_interval: 50
  eval_batches: 4
  mixed_precision: none
  activation_checkpointing: false
  granularity_sampling: random
  preprocess_num_proc: 1
  dataloader_num_workers: 0

dataset:
  dataset_name: roneneldan/TinyStories
  dataset_split: train
  dataset_phase: debug
  sample_limit: 768
  preprocessing_notes: balanced_warmup_500_reference

outputs:
  save_config: true
  save_metrics_csv: true
  save_run_summary_json: true
  save_checkpoints: true
  make_plots: false

monitoring:
  enabled: false
  backend: wandb
  project: probabilistic_adaptive_granularity
  job_type: train
  tags: [debug, probabilistic, adaptive-global, balanced-warmup]
  notes: five-granularity 500-step balanced warmup reference
  log_loss_by_granularity: true
  log_validation_loss: true
  log_stage_events: true

evaluation:
  validation:
    enabled: true
    interval_steps: 50
    run_at_completion: true
    holdout:
      source: configured_dataset_split
      examples: 8
    trailing_summary_evaluations: 2
  adaptive_controller:
    enabled: true
    source: configured_dataset_split
    examples: 128
    objective_weights: uniform
    fixed_manifest: true
  final_holdout:
    enabled: true
    source: configured_dataset_split
    examples: 512
    fixed_manifest: true
    evaluate_during_training: false
  test:
    enabled: false
  downstream_suite: []
  consistency: false
  speculative: false
