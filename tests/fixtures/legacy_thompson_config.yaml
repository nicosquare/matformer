# Pre-Bayesian Thompson shape retained only to verify the migration error.
run:
  run_id: legacy-thompson-config-001
  phase_id: probabilistic_adaptive_granularity
  model_family: nested
  model_size_label: debug
  sampling_mode: nested-random
  seed: 42
  output_root: outputs
  continuation:
    enabled: false

model:
  base_model_name: debug-llama
  granularity_sampling_mode: adaptive_per_block
  adaptive_sampler_strategy: thompson
  adaptive_sampler_exploration_scale: 1.0
  adaptive_sampler_decay_rate: 0.0
  adaptive_sampler_reward_penalty_weight: 0.0
  variant: slicing
  correction_mode: gmc
  tokenizer_name: hf-internal-testing/llama-tokenizer
  d_model: 128
  num_layers: 2
  num_attention_heads: 4
  context_length: 64
  vocab_size_assumption: 32000
  granularities: [s, m, l, xl]

training:
  token_budget: 8192
  max_steps: 4
  batch_size_per_process: 2
  learning_rate: 0.0003
  warmup_steps: 0
  pre_nested_warmup:
    enabled: false
    duration: 0
    unit: steps
  gradient_clip_norm: 1.0
  optimizer:
    preset: adam
  scheduler:
    name: cosine
  eval_interval: 2
  eval_batches: 1
  mixed_precision: none
  activation_checkpointing: false
  granularity_sampling: random
  preprocess_num_proc: 1
  dataloader_num_workers: 0

dataset:
  dataset_name: roneneldan/TinyStories
  dataset_split: train
  dataset_phase: debug
  sample_limit: 16
  preprocessing_notes: legacy_heuristic_thompson_config_shape

outputs:
  save_config: true
  save_metrics_csv: true
  save_run_summary_json: true
  save_checkpoints: false
  make_plots: false

monitoring:
  enabled: false
  backend: wandb
  project: probabilistic_adaptive_granularity
  job_type: train
  tags: [debug, legacy-thompson, migration]
  notes: old heuristic Thompson fields must not resolve as Bayesian inputs
  log_loss_by_granularity: true
  log_validation_loss: true
  log_stage_events: true

evaluation:
  validation: true
  downstream_suite: []
  consistency: false
  speculative: false
